<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL FICCT — Inscripción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050807;
  --panel:#0a1211;
  --teal-900:#062f30;
  --teal-700:#0e5c5c;
  --teal-500:#18a8a0;
  --teal-300:#7fe8db;
  --white:#f2f7f6;
  --mist:#9db3b0;
  --yellow:#f2c53d;
  --red:#e8564a;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--white);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(24,168,160,0.14), transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(24,168,160,0.10), transparent 45%);
  pointer-events:none;
  z-index:0;
}
.circuit{
  position:fixed;
  pointer-events:none;
  opacity:0.35;
  z-index:0;
}
.circuit-tr{top:-40px;right:-40px;width:min(46vw,420px);}
.circuit-bl{bottom:-40px;left:-40px;width:min(46vw,420px);transform:scaleX(-1);}
.circuit path{
  fill:none;
  stroke:var(--teal-500);
  stroke-width:1.4;
}
.circuit circle{fill:var(--teal-500);}
.circuit .pulse{
  stroke-dasharray:6 220;
  stroke-linecap:round;
  animation:travel 5.5s linear infinite;
}
@keyframes travel{
  0%{stroke-dashoffset:220;opacity:0;}
  8%{opacity:1;}
  92%{opacity:1;}
  100%{stroke-dashoffset:-40;opacity:0;}
}
.pixels{
  position:fixed;
  top:0;
  left:0;
  width:180px;
  height:100vh;
  pointer-events:none;
  z-index:0;
  opacity:0.5;
}
.pixel{
  position:absolute;
  width:9px;
  height:9px;
  background:var(--teal-500);
  animation:fall linear infinite;
}
.pixel:nth-child(odd){background:var(--white);opacity:0.6;width:6px;height:6px;}
@keyframes fall{
  0%{transform:translateY(-20px);opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{transform:translateY(110vh);opacity:0;}
}
.wrap{
  position:relative;
  z-index:1;
  max-width:920px;
  margin:0 auto;
  padding:72px 24px 40px;
}
.eyebrow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  letter-spacing:0.14em;
  color:var(--teal-300);
  text-transform:uppercase;
  margin-bottom:18px;
}
.eyebrow::before,.eyebrow::after{
  content:"";
  height:1px;
  width:36px;
  background:linear-gradient(90deg,transparent,var(--teal-500));
}
.eyebrow::after{background:linear-gradient(90deg,var(--teal-500),transparent);}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:clamp(34px,6vw,58px);
  text-align:center;
  line-height:1.05;
  letter-spacing:-0.01em;
}
h1 span{color:var(--teal-500);}
.subtitle{
  text-align:center;
  color:var(--mist);
  max-width:520px;
  margin:16px auto 44px;
  font-size:15.5px;
  line-height:1.6;
}
.console{
  position:relative;
  background:linear-gradient(180deg,var(--panel),#071312);
  border:1px solid rgba(127,232,219,0.16);
  border-radius:var(--radius);
  box-shadow:0 30px 80px -30px rgba(0,0,0,0.7), 0 0 0 1px rgba(24,168,160,0.04) inset;
  overflow:hidden;
}
.console-bar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:14px 18px;
  border-bottom:1px solid rgba(127,232,219,0.12);
  background:rgba(6,47,48,0.4);
}
.dot{width:9px;height:9px;border-radius:50%;}
.dot.r{background:var(--red);}
.dot.y{background:var(--yellow);}
.dot.g{background:var(--teal-500);}
.console-path{
  margin-left:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--mist);
}
form{
  padding:34px clamp(20px,4vw,44px) 40px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px 22px;
}
.field{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.field.full{grid-column:1/-1;}
label{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  letter-spacing:0.03em;
  color:var(--mist);
  display:flex;
  gap:6px;
  align-items:center;
}
label .req{color:var(--yellow);}
label .bracket{
  color:var(--teal-700);
  transition:color .2s ease, transform .2s ease;
}
.field:focus-within label .bracket{
  color:var(--teal-300);
}
.field:focus-within label .bracket.l{transform:translateX(-2px);}
.field:focus-within label .bracket.r{transform:translateX(2px);}
input,select,textarea{
  width:100%;
  background:#081615;
  border:1px solid rgba(127,232,219,0.14);
  border-radius:9px;
  padding:12px 14px;
  color:var(--white);
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  outline:none;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
textarea{resize:vertical;min-height:88px;}
input::placeholder,textarea::placeholder{color:#4b6260;}
input:focus,select:focus,textarea:focus{
  border-color:var(--teal-500);
  background:#0a1c1a;
  box-shadow:0 0 0 3px rgba(24,168,160,0.16);
}
select{appearance:none;cursor:pointer;}
.select-wrap{position:relative;}
.select-wrap::after{
  content:"▾";
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--teal-500);
  pointer-events:none;
  font-size:12px;
}
.modalidad{
  display:flex;
  gap:10px;
}
.chip{
  flex:1;
  text-align:center;
  padding:11px 10px;
  border:1px solid rgba(127,232,219,0.16);
  border-radius:9px;
  cursor:pointer;
  font-size:13.5px;
  color:var(--mist);
  transition:all .18s ease;
  user-select:none;
}
.chip.active{
  border-color:var(--teal-500);
  background:rgba(24,168,160,0.14);
  color:var(--white);
}
.chip input{display:none;}
.team-field{
  max-height:0;
  opacity:0;
  overflow:hidden;
  transition:max-height .35s ease, opacity .3s ease, margin .3s ease;
  grid-column:1/-1;
}
.team-field.show{
  max-height:120px;
  opacity:1;
  margin-top:2px;
}
.hint{
  font-size:12px;
  color:#5c7573;
  margin-top:2px;
}
.error-text{
  font-size:12px;
  color:var(--red);
  min-height:14px;
  display:none;
}
.field.invalid input,.field.invalid select{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(232,86,74,0.14);
}
.field.invalid .error-text{display:block;}
.submit-row{
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.submit-note{
  font-size:12.5px;
  color:#5c7573;
  max-width:280px;
}
button.submit{
  background:var(--teal-500);
  color:#04211f;
  border:none;
  border-radius:10px;
  padding:14px 26px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  letter-spacing:0.01em;
  transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
  box-shadow:0 10px 30px -12px rgba(24,168,160,0.6);
}
button.submit:hover{
  background:var(--teal-300);
  transform:translateY(-1px);
}
button.submit:active{transform:translateY(0);}
.success{
  display:none;
  padding:50px 30px;
  text-align:center;
}
.success.show{display:block;}
.success .check{
  width:56px;
  height:56px;
  border-radius:50%;
  border:2px solid var(--teal-500);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  color:var(--teal-500);
  font-size:26px;
}
.success h3{
  font-family:'Space Grotesk',sans-serif;
  font-size:22px;
  margin-bottom:10px;
}
.success p{
  color:var(--mist);
  font-size:14px;
  max-width:380px;
  margin:0 auto;
  line-height:1.6;
}
.success .code{
  font-family:'JetBrains Mono',monospace;
  color:var(--teal-300);
  margin-top:18px;
  font-size:13px;
}
footer{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  padding:64px 24px 56px;
  text-align:center;
}
footer .logo{
  width:132px;
  height:132px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(127,232,219,0.25);
  box-shadow:0 0 0 8px rgba(24,168,160,0.05), 0 20px 50px -20px rgba(24,168,160,0.4);
}
footer .logo img{width:100%;height:100%;object-fit:cover;display:block;}
footer .brand{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:0.02em;
}
footer .brand span{color:var(--teal-500);}
.tiktok{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:11px 20px;
  border-radius:999px;
  border:1px solid rgba(127,232,219,0.2);
  background:rgba(24,168,160,0.06);
  color:var(--white);
  text-decoration:none;
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  transition:border-color .2s ease, background .2s ease, transform .2s ease;
}
.tiktok:hover{
  border-color:var(--teal-500);
  background:rgba(24,168,160,0.14);
  transform:translateY(-1px);
}
.tiktok svg{width:16px;height:16px;fill:var(--teal-300);}
.foot-note{
  font-size:11.5px;
  color:#4b6260;
  font-family:'JetBrains Mono',monospace;
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr;}
  .wrap{padding-top:56px;}
}
@media(prefers-reduced-motion:reduce){
  .circuit .pulse,.pixel{animation:none;}
}

body.pre-entry{overflow:hidden;height:100vh;}
body.pre-entry #mainContent{display:none;}
#introOverlay{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:26px;
  background:
    radial-gradient(circle at 50% 30%, rgba(24,168,160,0.16), transparent 55%),
    var(--bg);
  transition:opacity .6s ease, visibility .6s ease;
}
#introOverlay.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.intro-logo{
  width:min(52vw,220px);
  height:min(52vw,220px);
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(127,232,219,0.28);
  box-shadow:0 0 0 10px rgba(24,168,160,0.05), 0 30px 70px -20px rgba(24,168,160,0.45);
  animation:float 5s ease-in-out infinite;
}
.intro-logo img{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}
.intro-brand{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:clamp(26px,5vw,38px);
  letter-spacing:0.02em;
  text-align:center;
}
.intro-brand span{color:var(--teal-500);}
.intro-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--teal-300);
  text-align:center;
}
.enter-btn{
  margin-top:6px;
  background:transparent;
  color:var(--white);
  border:1px solid var(--teal-500);
  border-radius:999px;
  padding:14px 44px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:0.06em;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:color .25s ease, transform .15s ease;
}
.enter-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--teal-500);
  transform:translateX(-100%);
  transition:transform .3s ease;
  z-index:-1;
}
.enter-btn:hover{color:#04211f;}
.enter-btn:hover::before{transform:translateX(0);}
.enter-btn:active{transform:scale(0.97);}
#musicToggle{
  position:fixed;
  top:20px;
  right:20px;
  z-index:40;
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(127,232,219,0.25);
  background:rgba(6,47,48,0.6);
  backdrop-filter:blur(6px);
  color:var(--teal-300);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:border-color .2s ease, background .2s ease;
}
#musicToggle:hover{border-color:var(--teal-500);background:rgba(24,168,160,0.18);}
#musicToggle svg{width:18px;height:18px;fill:currentColor;}
#musicToggle.muted{color:#5c7573;}
</style>
</head>

<script>
const pixelField = document.getElementById('pixelField');
for(let i=0;i<26;i++){
  const p = document.createElement('div');
  p.className='pixel';
  p.style.left = Math.random()*160+'px';
  p.style.top = (Math.random()*-100)+'px';
  p.style.animationDuration = (6+Math.random()*7)+'s';
  p.style.animationDelay = (Math.random()*8)+'s';
  pixelField.appendChild(p);
}

let ytPlayer = null;
let ytReady = false;
let soundUnlocked = false;

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('ytAudio', {
    height:'1',
    width:'1',
    videoId:'C4r_IoUvyU0',
    playerVars:{
      autoplay:1,
      mute:1,
      controls:0,
      loop:1,
      playlist:'C4r_IoUvyU0',
      playsinline:1,
      disablekb:1,
      modestbranding:1
    },
    events:{
      onReady:(e)=>{
        ytReady = true;
        e.target.mute();
        e.target.playVideo();
      },
      onStateChange:(e)=>{
        if(e.data === YT.PlayerState.ENDED){
          ytPlayer.seekTo(0);
          ytPlayer.playVideo();
        }
      }
    }
  });
}

function unlockSound(){
  if(soundUnlocked || !ytPlayer || !ytReady) return;
  soundUnlocked = true;
  ytPlayer.unMute();
  ytPlayer.setVolume(100);
  ytPlayer.playVideo();
  musicToggle.classList.remove('muted');
}

const overlay = document.getElementById('introOverlay');
const enterBtn = document.getElementById('enterBtn');
const musicToggle = document.getElementById('musicToggle');
const body = document.body;

enterBtn.addEventListener('click', ()=>{
  overlay.classList.add('hide');
  body.classList.remove('pre-entry');
  unlockSound();
  setTimeout(()=>{ overlay.remove(); }, 650);
});

document.addEventListener('click', unlockSound, { once:true });
document.addEventListener('keydown', unlockSound, { once:true });

musicToggle.addEventListener('click', ()=>{
  if(!ytPlayer) return;
  soundUnlocked = true;
  const state = ytPlayer.getPlayerState();
  if(state === 1){
    ytPlayer.pauseVideo();
    musicToggle.classList.add('muted');
  } else {
    ytPlayer.unMute();
    ytPlayer.setVolume(100);
    ytPlayer.playVideo();
    musicToggle.classList.remove('muted');
  }
});
</script>

</body>
